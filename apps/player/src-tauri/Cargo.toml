[package]
name = "music-player-shell"
version = "0.0.12"
edition.workspace = true
publish.workspace = true

[lib]
name = "music_player_shell_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
music-audio = { path = "../../../packages/music-audio", features = ["device"] }
music-core = { path = "../../../packages/music-core" }
percent-encoding = "2"
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2", features = [] }
tauri-plugin-playback = { path = "../../../packages/tauri-plugin-playback" }
tempfile.workspace = true

# 系统文件对话框只在桌面使用；安卓的文件选择由 tauri-plugin-playback 完成
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-dialog = "2"

[dev-dependencies]
serde_json.workspace = true
tauri = { version = "2", features = ["test"] }

[features]
custom-protocol = ["tauri/custom-protocol"]
