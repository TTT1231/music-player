[workspace]
resolver = "3"
members = ["packages/music-core", "packages/music-audio"]

[workspace.package]
edition = "2024"
publish = false

[workspace.dependencies]
encoding_rs = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
symphonia = { version = "0.6", default-features = false, features = ["mp3", "ogg", "vorbis", "flac", "wav", "pcm", "aac", "isomp4", "id3v2"] }
tempfile = "3"
